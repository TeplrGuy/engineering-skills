name: Standards checker
on:
  pull_request:
    paths: ['standards/**', 'scripts/standards.js', 'tests/standards.test.js', '.github/workflows/standards-checker.yml']
  push:
    branches: [main]
    paths: ['standards/**', 'scripts/standards.js', 'tests/standards.test.js', '.github/workflows/standards-checker.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/standards.test.js
